<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <h1>Meet Captions</h1>
    <div id="status" class="status waiting">
      <span class="dot"></span>
      <span id="status-text">Checking...</span>
    </div>
  </div>

  <div id="info" class="info"></div>

  <div id="warning" class="warning hidden">
    Export your transcript before closing the Meet tab — it cannot be recovered after.
  </div>

  <div id="error" class="error hidden"></div>

  <div id="bridge" class="bridge">
    <label class="bridge-toggle">
      <input id="bridge-enable" type="checkbox">
      <span>Live transcript bridge (MCP)</span>
    </label>
    <input id="bridge-url" type="text" class="bridge-input" placeholder="http://127.0.0.1:6338" spellcheck="false">
    <input id="bridge-token" type="password" class="bridge-input" placeholder="bridge token" spellcheck="false">
    <div id="bridge-state" class="bridge-state hidden"></div>
  </div>

  <div class="actions">
    <button id="btn-copy" disabled>Copy to Clipboard</button>
    <button id="btn-download" disabled>Download as TXT</button>
    <button id="btn-clear" class="btn-danger" disabled>Clear</button>
  </div>

  <div class="footer">by <a href="https://github.com/nikooo777" target="_blank">Nikooo777</a></div>

  <script src="popup.js"></script>
</body>
</html>
